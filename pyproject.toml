[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leapfrog-media-filter"
version = "0.1.0"
description = "Server-side media filtering with canonical segments and media-server adapters"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "plexapi>=4.15.0",
    "nudenet>=3.4.2",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "huggingface_hub>=0.30.0",
    "transformers>=4.45.0",
]

[project.urls]
Homepage = "https://github.com/casperson/leapfrog"
Repository = "https://github.com/casperson/leapfrog"
Issues = "https://github.com/casperson/leapfrog/issues"

[project.scripts]
leapfrog = "leapfrog.main:main"
leapfrog-vidangel-export = "leapfrog.vidangel_export:main"
leapfrog-vidangel-sidecars = "leapfrog.vidangel_sidecars:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio[asyncio]>=4.0",
]
dev = [
    "build>=1.2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio[asyncio]>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["leapfrog*"]

[tool.setuptools.package-data]
leapfrog = ["web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["leapfrog"]
omit = [
    "leapfrog/main.py",
    "leapfrog/frame_extractor.py",   # requires ffmpeg binary
    "leapfrog/watcher.py",           # requires live Plex + running event loop
]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
